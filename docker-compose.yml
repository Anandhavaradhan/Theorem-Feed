# Personal deployment: local machine or a small VPS. Never distributed.
#   docker compose up -d --build
#   docker compose exec backend python -m app.seed_phase_a
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: theoremfeed
      POSTGRES_PASSWORD: theoremfeed
      POSTGRES_DB: theoremfeed
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U theoremfeed"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      # Entrypoint runs `pip install -U yt-dlp` on every start.
      TF_YTDLP_AUTOUPDATE: "1"
    restart: unless-stopped

  # Weekly (Sunday 04:00 UTC) update of registry images.
  # Note: the backend is built locally, so watchtower cannot re-pull it; yt-dlp
  # freshness comes from the entrypoint update above (and, in Phase F, a weekly
  # in-app apscheduler job that upgrades yt-dlp in place).
  watchtower:
    image: containrrr/watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --schedule "0 0 4 * * 0" --cleanup
    restart: unless-stopped

volumes:
  pgdata:
