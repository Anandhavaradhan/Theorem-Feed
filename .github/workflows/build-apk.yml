# Builds an installable Android APK on GitHub's servers (which have the Android
# SDK and NDK). The APK is uploaded as a workflow artifact, downloadable by
# signed-in GitHub users for 14 days. Personal use only; not a public release.
name: Build Android APK

on:
  push:
    branches: [claude/new-session-8gutm2]
    paths: ['mobile/**', '.github/workflows/build-apk.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.1'
          channel: stable
          cache: true

      - name: Disable Flutter analytics
        run: flutter --disable-analytics

      - name: System SQLite for host-side tests
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libsqlite3-dev

      - run: flutter pub get

      - run: flutter analyze

      - run: flutter test

      # Plugins (e.g. whisper_ggml) pin NDK versions the runner hasn't installed;
      # Gradle can only install them once the SDK licences are accepted.
      - name: Accept Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build release APK (arm64)
        run: flutter build apk --release --target-platform android-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: theoremfeed-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
          if-no-files-found: error
