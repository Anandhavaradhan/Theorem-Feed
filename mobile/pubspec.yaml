name: theoremfeed
description: "TheoremFeed: personal, ad-free, material-driven study app."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  fast_language_detector: ^1.0.0
  flutter:
    sdk: flutter
  flutter_math_fork: ^0.7.4
  flutter_riverpod: ^3.5.0
  llamadart: ^0.20.5
  material_ui: ^1.1.0
  media_kit: ^1.2.6
  media_kit_libs_video: ^1.0.7
  media_kit_video: ^2.0.1
  path: ^1.9.1
  path_provider: ^2.1.6
  sqlite3: ^3.9.1
  uuid: ^4.6.0
  whisper_ggml: ^2.10.0
  youtube_explode_dart: ^3.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/i18n/en.json
    - assets/graph/graph_seed_v1.json

# sqlite3 bundles its own SQLite (FTS5 enabled) into the Android app.
# On a Linux dev/test host we use the system library instead, so `flutter test`
# works offline.
hooks:
  user_defines:
    sqlite3:
      source:
        linux: system
